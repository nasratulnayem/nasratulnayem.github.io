<!-- Dock Interaction Script -->
<script>
(function() {
  function initDock() {
    var trigger = document.getElementById('dockToolsTrigger');
    var submenu = document.getElementById('dockToolsSubmenu');
    var themeBtn = document.getElementById('dockThemeToggle');

    // Submenu Toggle on Click / Tap
    if (trigger && submenu) {
      trigger.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        submenu.classList.toggle('is-open');
      });

      document.addEventListener('click', function(e) {
        if (!submenu.contains(e.target) && !trigger.contains(e.target)) {
          submenu.classList.remove('is-open');
        }
      });
    }

    // Live Theme Switching
    if (themeBtn) {
      var sunIcon = themeBtn.querySelector('.dock-icon-sun');
      var moonIcon = themeBtn.querySelector('.dock-icon-moon');

      function syncIcons(isDark) {
        if (sunIcon && moonIcon) {
          sunIcon.style.display = isDark ? 'inline-block' : 'none';
          moonIcon.style.display = isDark ? 'none' : 'inline-block';
        }
      }

      var current = document.documentElement.getAttribute('data-theme');
      var isDarkInit = current === 'dark' || (!current && (!window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches));
      syncIcons(isDarkInit);

      themeBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var curTheme = document.documentElement.getAttribute('data-theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var nextTheme = curTheme === 'dark' ? 'light' : 'dark';
        
        document.documentElement.setAttribute('data-theme', nextTheme);
        localStorage.setItem('theme', nextTheme);
        syncIcons(nextTheme === 'dark');

        // Also sync any other theme buttons or Plotly if present
        if (typeof window.setTheme === 'function') {
          window.setTheme(nextTheme);
        }
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initDock);
  } else {
    initDock();
  }
})();
</script>
