<!-- Preloader Overlay with Kinetic Geometric Rotation -->
<div id="ht-preloader" class="ht-preloader-overlay" aria-hidden="true">
  <div class="ht-preloader-stage">
    <figure class="ht-kinetic-loader">
      <div></div><div></div>
      <div></div><div></div>
      <div></div><div></div>
      <div></div><div></div>
    </figure>
  </div>
</div>

<style>
  .ht-preloader-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #000000;
    z-index: 9999999;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 1;
    visibility: visible;
    transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s ease;
    pointer-events: all;
  }

  .ht-preloader-overlay.is-loaded {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .ht-preloader-stage {
    position: relative;
    width: 120px;
    height: 120px;
  }

  figure.ht-kinetic-loader {
    margin: 0;
    transform: translate(-50%, -50%) rotate(0deg) scale(1.4, 1.4);
    position: absolute;
    left: 50%;
    top: 50%;
    width: 60px;
    height: 60px;
    border-radius: 150px;
    box-sizing: border-box;
    animation: ht-loader-rotation 20s infinite linear;
  }

  figure.ht-kinetic-loader div:after {
    content: "";
    width: 20px;
    height: 20px;
    border: 1px solid #ffffff;
    box-sizing: border-box;
    position: absolute;
    left: 20px;
    top: 20px;
    animation: ht-loader-shuffle 2s infinite;
  }

  figure.ht-kinetic-loader div:nth-child(1) { transform: rotate(0deg); }
  figure.ht-kinetic-loader div:nth-child(1):after { animation-delay: -0.5s; }

  figure.ht-kinetic-loader div:nth-child(2) { transform: rotate(45deg); }
  figure.ht-kinetic-loader div:nth-child(2):after { animation-delay: -1s; }

  figure.ht-kinetic-loader div:nth-child(3) { transform: rotate(90deg); }
  figure.ht-kinetic-loader div:nth-child(3):after { animation-delay: -1.5s; }

  figure.ht-kinetic-loader div:nth-child(4) { transform: rotate(135deg); }
  figure.ht-kinetic-loader div:nth-child(4):after { animation-delay: -2s; }

  figure.ht-kinetic-loader div:nth-child(5) { transform: rotate(180deg); }
  figure.ht-kinetic-loader div:nth-child(5):after { animation-delay: -2.5s; }

  figure.ht-kinetic-loader div:nth-child(6) { transform: rotate(225deg); }
  figure.ht-kinetic-loader div:nth-child(6):after { animation-delay: -3s; }

  figure.ht-kinetic-loader div:nth-child(7) { transform: rotate(270deg); }
  figure.ht-kinetic-loader div:nth-child(7):after { animation-delay: -3.5s; }

  figure.ht-kinetic-loader div:nth-child(8) { transform: rotate(315deg); }
  figure.ht-kinetic-loader div:nth-child(8):after { animation-delay: -4s; }

  @keyframes ht-loader-rotation {
    100% {
      transform: translate(-50%, -50%) rotate(-360deg) scale(1.4, 1.4);
    }
  }

  @keyframes ht-loader-shuffle {
    50% {
      transform: scale(0.4, 0.4) rotate(-90deg);
      border-radius: 50%;
    }
  }
</style>

<script>
  (function() {
    function hideLoader() {
      var loader = document.getElementById('ht-preloader');
      if (loader && !loader.classList.contains('is-loaded')) {
        loader.classList.add('is-loaded');
        setTimeout(function() {
          if (loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 600);
      }
    }

    // Dismiss as soon as page is loaded, with a small grace period for smooth appearance
    if (document.readyState === 'complete') {
      setTimeout(hideLoader, 350);
    } else {
      window.addEventListener('load', function() {
        setTimeout(hideLoader, 350);
      });
      // Safety fallback so users never get stuck
      setTimeout(hideLoader, 2500);
    }
  })();
</script>
