{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  (function() {
    document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
    var savedTheme = localStorage.getItem('theme');
    var isDark = savedTheme === 'dark' || (!savedTheme && (!window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches || true));
    if (savedTheme === 'light') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ base_path }}/assets/css/marketing.css?v={{ site.time | date: '%s' }}">
