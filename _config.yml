# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default" # The available themes options are "default", "air", "sunrise", "mint", "dirt" and "contrast"
title                    : "Nasratul Nayem — Full-Stack Developer | WordPress & Shopify Expert"
title_separator          : "·"
name                     : &name "Nasratul Nayem"
description              : &description "Nasratul Nayem — Full-Stack Web Developer, WordPress Expert & Automation Engineer from Bangladesh. High-performance WooCommerce, Shopify & AI workflows for global brands."
url                      : https://nasratulnayem.github.io
baseurl                  : ""
repository               : "nasratulnayem/nasratulnayem.github.io"

# Site Author
author:
  avatar           : "nasratul-nayem.jpg"
  name             : "Nasratul Nayem"
  pronouns         : 
  bio              : "Full-Stack Developer · WordPress & Shopify Expert · Automation Engineer — Building fast WooCommerce & AI workflows"
  location         : "Dhaka, Bangladesh · Remote Worldwide"
  employer         : "Freelance"
  uri              : "https://nasratulnayem.github.io"
  email            : "devnayem30@gmail.com"
  academia         :
  arxiv            :
  googlescholar    :
  inspire-hep      :
  impactstory      :
  orcid            :
  semantic         :
  ssrn             :
  pubmed           :
  researchgate     :
  scopus           :
  zotero           :
  bitbucket        :
  codepen          :
  dribbble         :
  github           : "nasratulnayem"
  kaggle           :
  stackoverflow    :
  artstation       :
  bluesky          :
  facebook         : "codex.nayem"
  flickr           :
  foursquare       :
  goodreads        :
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
