---
layout: default
---

{% include base_path %}

<main id="main" class="marketing-main marketing-main--home" role="main">
  <article class="marketing-page marketing-home" itemscope itemtype="https://schema.org/WebPage">
    {% if page.title %}<meta itemprop="headline" content="{{ page.title | strip_html | escape_once }}">{% endif %}
    {% if page.excerpt %}<meta itemprop="description" content="{{ page.excerpt | strip_html | escape_once }}">{% endif %}
    <section class="marketing-page__content home-page__content" itemprop="text">{{ content }}</section>
  </article>
</main>
